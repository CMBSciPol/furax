name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prek:
    name: "Run pre-commit hooks"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - name: "Cache prek"
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek-
      # ty resolves third-party imports from the environment, so the optional dependencies have
      # to be installed for it to see pixell, sotodlib, pysm3 and friends.
      - name: "Install dependencies"
        run: uv sync --locked --all-extras --no-default-groups --group lint
      - name: "Run prek"
        run: |
          echo '```console' > "$GITHUB_STEP_SUMMARY"
          # Enable color output for prek and remove it for the summary
          uv run --no-sync prek run --all-files --show-diff-on-failure --color always | \
            tee >(sed -E 's/\x1B\[([0-9]{1,2}(;[0-9]{1,2})*)?[mGK]//g' >> "$GITHUB_STEP_SUMMARY") >&1
          exit_code="${PIPESTATUS[0]}"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"

  test:
    name: "Run tests on Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # System interpreter may lack Python headers, needed for building `s2fft` from git
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}
      - name: "Install dependencies"
        run: uv sync --locked --all-extras
      # Most of the suite's wall time is XLA compilation of small kernels that do not change
      # between runs. Entries are keyed on the jaxlib version too, so the lockfile is part of
      # the cache key; a test that compiles something new simply misses. A cache is never
      # overwritten under its key, so every run on main saves under a key of its own (the run and
      # its attempt), and every run restores the newest: new kernels are then compiled once.
      - name: "Restore compiled XLA kernels"
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pytest_cache/jax
          key: jax-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jax-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-
            jax-${{ matrix.python-version }}-
      - name: "Run tests"
        run: uv run pytest -vv -n auto
      # `insubprocess` tests re-exec themselves, which xdist reads as a worker crash, so the
      # parallel selection above drops them and they run here instead.
      - name: "Run in-subprocess tests"
        run: uv run pytest -vv -m insubprocess
      - name: "Run distributed tests"
        run: uv run pytest -vv -m distributed
      # Only main saves: a pull request's kernels serve that pull request alone, and saving them
      # would evict main's from the repository's cache storage.
      - name: "Save compiled XLA kernels"
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .pytest_cache/jax
          key: jax-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
