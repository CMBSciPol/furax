# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # hatch-vcs derives the version from a tag that may sit beyond the shallow clone
    post_checkout:
      - git fetch --unshallow || true
    install:
      - pip install uv
    build:
      html:
        # The project itself is installed: executing the notebooks imports furax
        - uv run --group docs --no-dev sh docs/build.sh
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/

submodules:
  include: all
  recursive: true
